<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DETAILS</title>
  <link rel="stylesheet" href="details-style.1.css">
</head>
<body>
  <div>
    <style>
      :root {
        --details-animation-length: 400ms;
        --details-animation-length-outside: 500ms;
        --surface-border-radius: 15px;
      }

      .calc-holder {
        border-radius: var(--surface-border-radius);
        box-shadow: 0 20px 25px -5px rgb(0 0 0 / 32%), 
                    6px 4px 12px 3px rgb(0 0 0 / 32%);
      }
      
      .button-surface {
        background-color: hsla(var(--darkAccent-hsl), 1);
        border: thin solid hsla(var(--accent-hsl), 1);
        border-radius: var(--surface-border-radius);
        padding: 1rem 2rem;

        & details {
          cursor: pointer;
          text-align: center;

          & h2,
          & p {
            color: hsla(var(--lightAccent-hsl), 1);
          }
        }

        & .instructions {
          opacity: 1;
          transition:
          opacity var(--details-animation-length-outside),
          content-visibility var(--details-animation-length) allow-discrete;
        }

        & details[open] {
          & .instructions {
            opacity: 0;
          }
        }

        & details::details-content {
          opacity: 0;
          transition:
            opacity var(--details-animation-length-outside),
            content-visibility var(--details-animation-length) allow-discrete;
        }

        & details[open]::details-content {
          opacity: 1;
        }
      }
    </style>
    <div id="cauti-cost-calculator" class="calc-holder">
      <div class="button-surface">
        <details>
          <summary>
            <h2><strong>CAUTI Cost Calculator</strong></h2>
            <p class="sqsrte-large instructions">
              Click to expand this area and spin up a live instance of the calculator!
            </p>
          </summary>
          <iframe
            loading="lazy"
            src="https://psep-apps.med.umich.edu/CAUTI/"
            title="CAUTI Cost Calculator"
            width="100%" height="1120">
          </iframe>
        </details>
      </div>
    </div>
  </div>
</body>
</html>
